# ===================================================================
# Database Connection & HikariCP Pool Configuration
# ===================================================================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/enterprise_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
jdbc.username=root
jdbc.password=

# HikariCP Connection Pool Settings
hikaricp.maximumPoolSize=20
hikaricp.minimumIdle=5
hikaricp.idleTimeout=30000
hikaricp.connectionTimeout=20000
hikaricp.maxLifetime=1800000

# ===================================================================
# Hibernate Properties
# ===================================================================
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update
hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
hibernate.connection.CharSet=utf8mb4
hibernate.connection.characterEncoding=utf8mb4
hibernate.connection.useUnicode=true
